<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ResultHub - Student Portal</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="light-mode">
    <!-- TOP NAVIGATION BAR -->
    <nav class="navbar">
        <div class="navbar-container">
            <div class="navbar-logo">
                <i class="fas fa-graduation-cap"></i>
                <span>ResultHub</span>
            </div>

            <div class="navbar-right">
                <span id="userDisplay" class="user-display"></span>
                <button class="theme-toggle" id="themeToggle" title="Toggle dark mode">
                    <i class="fas fa-moon"></i>
                </button>
                <button id="logoutBtn" class="btn-logout" title="Logout">
                    <i class="fas fa-sign-out-alt"></i> Logout
                </button>
            </div>

            <button class="mobile-menu-toggle" id="mobileMenuToggle">
                <i class="fas fa-bars"></i>
            </button>
        </div>
    </nav>

    <!-- MAIN CONTENT -->
    <div class="main-content">
        <div class="page-header">
            <h2><i class="fas fa-user-graduate"></i> Student Portal - Check Your Result</h2>
            <p>Enter your roll number to view your exam results and grades.</p>
        </div>

        <!-- Search Section -->
        <div class="search-section">
            <div class="search-card">
                <h3>Search Results by Roll Number</h3>
                <div class="search-input-group">
                    <input 
                        type="text" 
                        id="searchRollNumber" 
                        class="search-input-large"
                        placeholder="Enter your roll number (e.g., 2024001)"
                        autocomplete="off"
                    >
                    <button class="btn-search" id="searchBtn" onclick="searchStudentResult()">
                        <i class="fas fa-search"></i> Check Result
                    </button>
                </div>
                <small class="help-text"><i class="fas fa-info-circle"></i> Press Enter or click "Check Result" to search</small>
            </div>
        </div>

        <!-- Loading Spinner -->
        <div id="loadingSpinner" class="loading-spinner">
            <div class="spinner"></div>
            <p>Searching...</p>
        </div>

        <!-- Results Container -->
        <div id="resultsContainer" class="results-container-student">
            <p class="empty-state no-results"><i class="fas fa-search"></i> Enter a roll number to view results</p>
        </div>
    </div>

    <!-- Toast Notification -->
    <div id="toast" class="toast"></div>

    <script src="script.js"></script>
</body>
</html>
