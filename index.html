<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ResultHub - Login</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="login-container">
        <div class="login-wrapper">
            <!-- Logo & Title -->
            <div class="login-header">
                <div class="login-logo">
                    <i class="fas fa-graduation-cap"></i>
                </div>
                <h1>ResultHub</h1>
                <p>Student Result Management System</p>
            </div>

            <!-- Login Form -->
            <form id="loginForm">
                <!-- Username/Roll Number Field -->
                <div class="form-group">
                    <label for="username">Username or Roll Number</label>
                    <div class="input-group">
                        <i class="fas fa-user"></i>
                        <input 
                            type="text" 
                            id="username" 
                            placeholder="Enter username or roll number"
                            required
                        >
                    </div>
                </div>

                <!-- Password Field -->
                <div class="form-group">
                    <label for="password">Password</label>
                    <div class="input-group">
                        <i class="fas fa-lock"></i>
                        <input 
                            type="password" 
                            id="password" 
                            placeholder="Enter password"
                            required
                        >
                    </div>
                </div>

                <!-- Error Message -->
                <div id="loginError" class="error-message" style="display: none;"></div>

                <!-- Login Button -->
                <button type="submit" class="btn-login">
                    <i class="fas fa-sign-in-alt"></i> Login
                </button>
            </form>

            <!-- Role Selection Buttons -->
            <div class="role-selector">
                <p class="role-label">Select Role:</p>
                <div class="role-buttons">
                    <button type="button" class="role-btn teacher-btn" onclick="selectRole('teacher')">
                        <i class="fas fa-chalkboard-user"></i> Teacher
                    </button>
                    <button type="button" class="role-btn student-btn" onclick="selectRole('student')">
                        <i class="fas fa-user-graduate"></i> Student
                    </button>
                </div>
            </div>

            <!-- Demo Info -->
            <div class="login-footer">
                <p><small><i class="fas fa-info-circle"></i> Demo credentials: Any username and password works</small></p>
            </div>
        </div>

        <!-- Background Animation -->
        <div class="background-animation">
            <div class="gradient-orb orb-1"></div>
            <div class="gradient-orb orb-2"></div>
            <div class="gradient-orb orb-3"></div>
        </div>
    </div>

    <!-- Toast Notification -->
    <div id="toast" class="toast"></div>

    <script src="script.js"></script>
</body>
</html>
>
